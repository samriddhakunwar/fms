{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Factory Management System</h1>
<p>Sign in to continue.</p>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post" id="login-form">
  {% csrf_token %}
  <div>
    <label for="id_username">Username</label><br>
    <input type="text" id="id_username" name="username" autocomplete="username" autofocus required>
  </div>
  <br>
  <div>
    <label for="id_password">Password</label><br>
    <input type="password" id="id_password" name="password" autocomplete="current-password" required>
  </div>
  <br>
  <button type="submit" id="login-btn">Sign In</button>
</form>
{% endblock %}
